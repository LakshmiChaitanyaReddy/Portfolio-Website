<style>
/* ══════════════════════════════════════════════════════════════════════
   THEME TOKENS
   These are DEFAULTS ONLY. themes.js writes the active theme as inline
   custom properties on <html>, which beat everything here — so the site
   still renders correctly if themes.js or data.json fails to load.

   To change the look, use admin.html's Theme tab (or edit themes.js).
   To change the fallback, edit this block.
   ══════════════════════════════════════════════════════════════════════ */
:root {
  /* ── Accent. Only --accent is authored; the rest derive from it, which
        is why changing one colour in the theme builder just works. ───── */
  --accent:        #5cc8a8;
  --accent-lift:   #ffffff;                                           /* mixed into accent for hover  */
  --accent-strong: color-mix(in srgb, var(--accent) 78%, var(--accent-lift));
  --accent-soft:   color-mix(in srgb, var(--accent) 12%, transparent);
  --on-accent:     #06120e;                                           /* text ON a filled accent      */

  /* ── Feedback ───────────────────────────────────────────────────────── */
  --danger: #ff6b6b;
  --warn:   #e3b341;

  /* ── Surfaces: page → alternating band → card → chip ─────────────────── */
  --bg:        #0d1117;
  --bg-alt:    #10161f;
  --surface:   #151c26;
  --surface-2: #1b2430;
  --header-bg: color-mix(in srgb, var(--bg) 80%, transparent);

  /* ── Text: three levels of emphasis ─────────────────────────────────── */
  --text:      #e8edf4;
  --text-mid:  #b3bdcb;
  --text-dim:  #7d8899;

  /* ── Lines & shadow ─────────────────────────────────────────────────── */
  --border:   #232d3b;
  --border-2: #303d4e;
  --shadow:   0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);

  /* ── Typography ─────────────────────────────────────────────────────── */
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body:    "Inter", system-ui, -apple-system, sans-serif;
  --font-mono:    "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  --fs-scale:     1;          /* multiplies every rem on the page   */
  --h-scale:      1;          /* multiplies heading sizes only      */
  --line-height:  1.7;
  --h-weight:     600;
  --h-tracking:   -0.02em;

  /* ── Shape & density ────────────────────────────────────────────────── */
  --maxw:        1080px;
  --radius:      14px;
  --radius-sm:   8px;
  --chip-radius: 6px;
  --gutter:      clamp(1.25rem, 5vw, 2.5rem);
  --section-y:   clamp(4.5rem, 10vw, 7.5rem);
  --gap:         1.1rem;
  --nav-h:       68px;

  /* ── Motion ─────────────────────────────────────────────────────────── */
  --ease:  cubic-bezier(.22,.61,.36,1);
  --speed: .35s;
}

/* Fallback light palette, used only if themes.js doesn't load. */
[data-theme="light"] {
  --accent:      #0f8a6a;
  --accent-lift: #000000;
  --on-accent:   #ffffff;
  --danger:      #c62828;
  --warn:        #8a6100;
  --bg:        #fbfbf9;
  --bg-alt:    #f3f4f1;
  --surface:   #ffffff;
  --surface-2: #f1f3f0;
  --text:      #14181d;
  --text-mid:  #414a55;
  --text-dim:  #6b7480;
  --border:    #e2e4e0;
  --border-2:  #c9cdc7;
  --shadow:    0 1px 2px rgba(20,24,29,.05), 0 12px 28px rgba(20,24,29,.07);
}

/* ══════════════════════════════════════════════════════════════════════
   BASE
   ══════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html {
  font-size: calc(100% * var(--fs-scale));
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--nav-h) + 20px);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text-mid);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: var(--line-height);
  -webkit-font-smoothing: antialiased;
  transition: background-color var(--speed) var(--ease), color var(--speed) var(--ease);
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  color: var(--text);
  line-height: 1.18;
  margin: 0 0 .6rem;
  letter-spacing: var(--h-tracking);
  font-weight: var(--h-weight);
}
h1 { font-size: calc(clamp(2.15rem, 6.4vw, 3.55rem) * var(--h-scale)); }
h2 { font-size: calc(clamp(1.55rem, 3.6vw, 2.1rem) * var(--h-scale)); }
h3 { font-size: calc(1.125rem * var(--h-scale)); }
h4 { font-size: calc(.95rem * var(--h-scale)); }
p  { margin: 0 0 1rem; }
ul, ol { margin: 0; padding: 0; list-style: none; }

a { color: var(--accent); text-decoration: none; transition: color .2s var(--ease); }
a:hover { color: var(--accent-strong); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

img { max-width: 100%; height: auto; display: block; }
svg { vertical-align: middle; }
.icon { width: 1em; height: 1em; stroke-width: 2; }

.container { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); }

.visually-hidden {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 200;
  background: var(--accent); color: var(--on-accent);
  padding: .7rem 1.1rem; font-weight: 600; border-radius: 0 0 var(--radius-sm) 0;
}
.skip-link:focus { left: 0; color: var(--on-accent); }

.noscript {
  margin: 0; padding: 1rem var(--gutter);
  background: var(--surface); border-bottom: 1px solid var(--border);
  text-align: center; font-size: .95rem;
}

/* ══════════════════════════════════════════════════════════════════════
   HEADER / NAV
   ══════════════════════════════════════════════════════════════════════ */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--header-bg);
  backdrop-filter: saturate(160%) blur(12px);
  -webkit-backdrop-filter: saturate(160%) blur(12px);
  border-bottom: 1px solid transparent;
  transition: border-color var(--speed) var(--ease), background-color var(--speed) var(--ease);
}
.site-header.is-stuck { border-bottom-color: var(--border); }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; height: var(--nav-h); }

.brand { font-family: var(--font-mono); font-size: .95rem; font-weight: 500; color: var(--text); white-space: nowrap; }
.brand:hover { color: var(--text); }
.brand .dot { color: var(--accent); }

.nav-links { display: none; align-items: center; gap: .15rem; }
.nav-links a {
  display: block; padding: .45rem .7rem; border-radius: var(--radius-sm);
  font-size: .875rem; font-weight: 500; color: var(--text-dim);
  transition: color .2s var(--ease), background-color .2s var(--ease);
}
.nav-links a:hover { color: var(--text); background: var(--surface-2); }
.nav-links a.is-active { color: var(--accent); }

.nav-actions { display: flex; align-items: center; gap: .5rem; }

.icon-btn {
  display: inline-grid; place-items: center;
  width: 38px; height: 38px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: transparent; color: var(--text-mid);
  cursor: pointer; font-size: 1.05rem;
  transition: border-color .2s var(--ease), color .2s var(--ease), background-color .2s var(--ease);
}
.icon-btn:hover { color: var(--text); border-color: var(--border-2); background: var(--surface-2); }

[data-theme="dark"]  .i-sun  { display: block; }
[data-theme="dark"]  .i-moon { display: none; }
[data-theme="light"] .i-sun  { display: none; }
[data-theme="light"] .i-moon { display: block; }

.mobile-menu { display: none; border-top: 1px solid var(--border); background: var(--bg); }
.mobile-menu.is-open { display: block; }
.mobile-menu ul { padding: .6rem 0 1rem; }
.mobile-menu a {
  display: block; padding: .7rem .25rem; font-size: 1rem; font-weight: 500;
  color: var(--text-mid); border-bottom: 1px solid var(--border);
}
.mobile-menu a.is-active { color: var(--accent); }

@media (min-width: 960px) {
  .nav-links { display: flex; }
  #menu-toggle, .mobile-menu { display: none !important; }
}

/* ══════════════════════════════════════════════════════════════════════
   BUTTONS
   ══════════════════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: .55rem;
  padding: .75rem 1.25rem; border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-family: var(--font-body); font-size: .925rem; font-weight: 600;
  cursor: pointer;
  transition: transform .2s var(--ease), background-color .2s var(--ease),
              border-color .2s var(--ease), color .2s var(--ease);
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-strong); color: var(--on-accent); }
.btn-ghost { background: transparent; border-color: var(--border-2); color: var(--text); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ══════════════════════════════════════════════════════════════════════
   LOADING SKELETON + ERROR STATE
   ══════════════════════════════════════════════════════════════════════ */
.sk { position: relative; overflow: hidden; background: var(--surface-2); border-radius: 6px; }
.sk::after {
  content: ""; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, var(--surface), transparent);
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer { 100% { transform: translateX(100%); } }

.sk-pill  { width: 220px; height: 30px; border-radius: 999px; margin-bottom: 1.6rem; }
.sk-h1    { width: min(100%, 640px); height: 56px; margin-bottom: .9rem; }
.sk-h1.b  { width: min(100%, 420px); }
.sk-role  { width: 260px; height: 24px; margin-bottom: 1.4rem; }
.sk-line  { width: min(100%, 620px); height: 14px; margin-bottom: .6rem; }
.sk-line.short { width: min(100%, 420px); }
.sk-btns  { display: flex; gap: .75rem; margin-top: 1.8rem; }
.sk-btn   { width: 150px; height: 44px; border-radius: var(--radius-sm); }
.sk-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; margin-top: 3.5rem;
            background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.sk-stats > div { background: var(--bg); padding: 1.25rem 1.35rem; }
.sk-stat-n { width: 70px; height: 28px; margin-bottom: .5rem; }
.sk-stat-l { width: 120px; height: 11px; }
@media (min-width: 720px) { .sk-stats { grid-template-columns: repeat(4, 1fr); } }
.sk-cards { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.sk-card  { height: 168px; border-radius: var(--radius); }

.error-panel {
  border: 1px solid var(--border); border-left: 3px solid var(--danger);
  border-radius: var(--radius); background: var(--surface);
  padding: 1.75rem 1.85rem; max-width: 65ch;
}
.error-panel h2 { font-size: calc(1.35rem * var(--h-scale)); }
.error-panel code {
  font-family: var(--font-mono); font-size: .82em;
  background: var(--surface-2); padding: .12rem .4rem; border-radius: 4px; color: var(--text);
}
.error-detail {
  font-family: var(--font-mono); font-size: .8rem; color: var(--text-dim);
  background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: .7rem .85rem; margin: 1rem 0 1.25rem; overflow-wrap: anywhere;
}

/* ══════════════════════════════════════════════════════════════════════
   SECTION SCAFFOLDING
   ══════════════════════════════════════════════════════════════════════ */
section { padding-block: var(--section-y); }
.section-alt { background: var(--bg-alt); transition: background-color var(--speed) var(--ease); }

.section-head { margin-bottom: clamp(2rem, 4vw, 3rem); max-width: 64ch; }
.eyebrow {
  display: inline-flex; align-items: center; gap: .55rem;
  font-family: var(--font-mono); font-size: .78rem;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--accent); margin-bottom: .85rem;
}
.eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--accent); opacity: .6; }
.section-head p { color: var(--text-dim); margin: .4rem 0 0; }

.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip {
  font-family: var(--font-mono); font-size: .78rem;
  padding: .3rem .6rem; border-radius: var(--chip-radius);
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-mid); white-space: nowrap;
}

/* ══════════════════════════════════════════════════════════════════════
   HERO
   ══════════════════════════════════════════════════════════════════════ */
.hero { position: relative; padding-block: clamp(3.5rem, 11vw, 7.5rem) clamp(3.5rem, 9vw, 6rem); overflow: hidden; }
.hero::before {
  content: ""; position: absolute; top: -35%; left: 50%;
  width: min(900px, 130vw); aspect-ratio: 1; transform: translateX(-50%);
  background: radial-gradient(circle, var(--accent-soft) 0%, transparent 62%);
  pointer-events: none;
}
.hero > .container { position: relative; }

.hero-photo {
  width: clamp(88px, 14vw, 116px); aspect-ratio: 1;
  border-radius: 50%; object-fit: cover;
  border: 1px solid var(--border-2);
  margin-bottom: 1.5rem;
}

.hero-tag {
  display: inline-flex; align-items: center; gap: .6rem;
  padding: .35rem .8rem .35rem .6rem;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--surface); font-family: var(--font-mono);
  font-size: .8rem; color: var(--text-dim); margin-bottom: 1.6rem;
}
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2.4s infinite; }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 var(--accent-soft); }
  70%  { box-shadow: 0 0 0 9px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}

.hero h1 { max-width: 15ch; }
.hero-role {
  font-family: var(--font-display); font-size: calc(clamp(1.05rem, 2.6vw, 1.4rem) * var(--h-scale));
  font-weight: 500; color: var(--accent); margin: .5rem 0 1.15rem;
}
.hero-pitch { font-size: clamp(1.02rem, 2vw, 1.15rem); max-width: 60ch; }
.hero-meta {
  display: flex; flex-wrap: wrap; gap: 1.25rem;
  margin: 1.5rem 0 2rem; font-family: var(--font-mono);
  font-size: .85rem; color: var(--text-dim);
}
.hero-meta span { display: inline-flex; align-items: center; gap: .45rem; }
.hero-cta { display: flex; flex-wrap: wrap; gap: .75rem; }

.hero-stats {
  display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1px;
  margin: clamp(3rem, 7vw, 4.5rem) 0 0;
  background: var(--border); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.hero-stats > div { background: var(--bg); padding: 1.25rem 1.35rem; }
.hero-stats dt {
  font-family: var(--font-display); font-weight: 700;
  font-size: calc(clamp(1.4rem, 3.4vw, 1.85rem) * var(--h-scale)); color: var(--text); letter-spacing: var(--h-tracking);
}
.hero-stats dd { margin: .2rem 0 0; font-size: .8rem; color: var(--text-dim); line-height: 1.45; }
@media (min-width: 720px) { .hero-stats { grid-template-columns: repeat(4, 1fr); } }

/* ══════════════════════════════════════════════════════════════════════
   ABOUT
   ══════════════════════════════════════════════════════════════════════ */
.about-grid { display: grid; gap: clamp(2rem, 5vw, 3.5rem); }
@media (min-width: 900px) { .about-grid { grid-template-columns: 1.35fr .85fr; } }
.about-body p:last-child { margin-bottom: 0; }
.about-body strong { color: var(--text); font-weight: 600; }

.facts {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 1.4rem 1.5rem; align-self: start;
}
.facts h3 {
  font-family: var(--font-mono); font-size: .8rem; font-weight: 500;
  text-transform: uppercase; letter-spacing: .09em; color: var(--text-dim);
}
.facts dl { margin: .9rem 0 0; display: grid; gap: .85rem; }
.facts dt { font-size: .78rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
.facts dd { margin: .1rem 0 0; color: var(--text); font-size: .95rem; }

/* ══════════════════════════════════════════════════════════════════════
   SKILLS
   ══════════════════════════════════════════════════════════════════════ */
.skill-grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); }
.skill-card {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 1.4rem 1.5rem 1.55rem;
  transition: border-color .25s var(--ease), transform .25s var(--ease);
}
.skill-card:hover { border-color: var(--border-2); transform: translateY(-2px); }
.skill-card h3 { display: flex; align-items: center; gap: .6rem; font-size: calc(1rem * var(--h-scale)); margin-bottom: 1rem; }
.skill-card h3 .icon { color: var(--accent); width: 1.05em; height: 1.05em; }

/* ══════════════════════════════════════════════════════════════════════
   TIMELINE (experience + custom timeline sections)
   ══════════════════════════════════════════════════════════════════════ */
.timeline { position: relative; padding-left: 1.9rem; }
.timeline::before {
  content: ""; position: absolute; left: 5px; top: .55rem; bottom: .55rem;
  width: 1px; background: linear-gradient(to bottom, var(--accent), var(--border) 55%);
}
.tl-item { position: relative; padding-bottom: clamp(2.25rem, 5vw, 3.25rem); }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before {
  content: ""; position: absolute; left: calc(-1.9rem + 1px); top: .55rem;
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--bg-alt); border: 2px solid var(--border-2);
}
.tl-item.is-current::before { border-color: var(--accent); background: var(--accent); }

.tl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .35rem .75rem; }
.tl-head h3 { margin: 0; }
.tl-date { margin-left: auto; font-family: var(--font-mono); font-size: .8rem; color: var(--text-dim); white-space: nowrap; }
.tl-sub {
  display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .6rem;
  font-size: .875rem; color: var(--text-dim); margin: .15rem 0 .9rem;
}
.tl-company { color: var(--accent); font-weight: 600; }
.tl-sep { opacity: .45; }
.tl-dur { font-family: var(--font-mono); font-size: .75rem; padding: .1rem .45rem; border: 1px solid var(--border); border-radius: 999px; }
.tl-summary { margin: 0 0 .9rem; }
.tl-list { display: grid; gap: .6rem; margin-bottom: 1rem; }
.tl-list li { position: relative; padding-left: 1.15rem; font-size: .95rem; }
.tl-list li::before {
  content: ""; position: absolute; left: 0; top: .68em;
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: .65;
}
.tl-list strong { color: var(--text); font-weight: 600; }

/* ══════════════════════════════════════════════════════════════════════
   PROJECTS + FILTER BAR
   ══════════════════════════════════════════════════════════════════════ */
.filter-bar { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: .9rem; }
.filter-btn {
  font-family: var(--font-mono); font-size: .78rem;
  padding: .38rem .75rem; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-dim); cursor: pointer;
  transition: color .2s var(--ease), border-color .2s var(--ease), background-color .2s var(--ease);
}
.filter-btn:hover { color: var(--text); border-color: var(--border-2); }
.filter-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.filter-status { font-family: var(--font-mono); font-size: .78rem; color: var(--text-dim); margin: 0 0 1.5rem; }

.project-grid { display: grid; gap: var(--gap); grid-template-columns: 1fr; }
@media (min-width: 640px) {
  .project-grid { grid-template-columns: repeat(2, 1fr); }
  .project-card.is-featured { grid-column: span 2; }
}
@media (min-width: 1000px) {
  .project-grid { grid-template-columns: repeat(6, 1fr); }
  .project-card { grid-column: span 2; }
  .project-card.is-featured { grid-column: span 3; }
}

.project-card {
  display: flex; flex-direction: column;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 1.45rem 1.55rem 1.55rem;
  transition: border-color .25s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease);
}
.project-card:hover { border-color: var(--border-2); transform: translateY(-3px); box-shadow: var(--shadow); }
.project-card.is-featured { padding: 1.85rem 1.95rem 1.95rem; border-color: var(--border-2); }
.project-card.is-featured h3 { font-size: calc(1.35rem * var(--h-scale)); }
.project-card.is-featured .project-blurb { font-size: 1.02rem; }

.project-cover {
  width: calc(100% + 3.1rem); margin: -1.45rem -1.55rem 1.2rem;
  border-radius: var(--radius) var(--radius) 0 0;
  aspect-ratio: 16 / 9; object-fit: cover;
  border-bottom: 1px solid var(--border);
}
.project-card.is-featured .project-cover { width: calc(100% + 3.9rem); margin: -1.85rem -1.95rem 1.4rem; }

.project-top { display: flex; align-items: center; gap: .7rem; margin-bottom: .7rem; }
.project-num { font-family: var(--font-mono); font-size: .75rem; color: var(--accent); letter-spacing: .08em; }
.featured-flag {
  font-family: var(--font-mono); font-size: .66rem; text-transform: uppercase; letter-spacing: .09em;
  padding: .16rem .5rem; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent);
}
.project-card h3 { margin-bottom: .5rem; }
.project-blurb { color: var(--text-mid); margin-bottom: 1.1rem; font-size: .95rem; }

.pap { display: grid; gap: .8rem; margin: 0 0 1.25rem; }
.pap > div { display: grid; grid-template-columns: 5.6rem 1fr; gap: .75rem; }
.pap dt {
  font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase;
  letter-spacing: .07em; color: var(--text-dim); padding-top: .18rem;
}
.pap dd { margin: 0; font-size: .92rem; line-height: 1.6; }
.pap .is-result dd { color: var(--text); }
@media (max-width: 430px) { .pap > div { grid-template-columns: 1fr; gap: .1rem; } }

.project-links { display: flex; flex-wrap: wrap; gap: .9rem; margin-bottom: 1rem; font-size: .85rem; }
.project-links a { display: inline-flex; align-items: center; gap: .35rem; }
.project-card .chips { margin-top: auto; padding-top: .35rem; }

/* ══════════════════════════════════════════════════════════════════════
   CUSTOM SECTIONS — five layouts, all driven from data.json
   ══════════════════════════════════════════════════════════════════════ */
.custom-grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.custom-card {
  display: flex; flex-direction: column;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 1.4rem 1.5rem 1.5rem;
  transition: border-color .25s var(--ease), transform .25s var(--ease);
}
.custom-card:hover { border-color: var(--border-2); transform: translateY(-2px); }
.custom-card h3 { margin-bottom: .25rem; }
.custom-cover {
  width: calc(100% + 3rem); margin: -1.4rem -1.5rem 1.15rem;
  border-radius: var(--radius) var(--radius) 0 0;
  aspect-ratio: 16 / 9; object-fit: cover; border-bottom: 1px solid var(--border);
}
.custom-meta { font-family: var(--font-mono); font-size: .78rem; color: var(--text-dim); margin: 0 0 .6rem; }
.custom-sub { color: var(--accent); font-weight: 600; font-size: .9rem; margin: 0 0 .5rem; }
.custom-body { font-size: .93rem; margin-bottom: .9rem; }
.custom-card .chips, .row-item .chips { margin-top: auto; padding-top: .4rem; }
.custom-links { display: flex; flex-wrap: wrap; gap: .9rem; font-size: .85rem; margin-bottom: .7rem; }
.custom-links a { display: inline-flex; align-items: center; gap: .35rem; }

.row-list { display: grid; }
.row-item {
  display: grid; gap: .15rem .9rem;
  padding: 1.1rem 0; border-bottom: 1px solid var(--border);
}
.row-item:first-child { padding-top: 0; }
.row-item:last-child { border-bottom: 0; padding-bottom: 0; }
.row-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem .8rem; }
.row-top h3 { margin: 0; font-size: calc(1.02rem * var(--h-scale)); }
.row-meta { margin-left: auto; font-family: var(--font-mono); font-size: .78rem; color: var(--text-dim); white-space: nowrap; }
.row-sub { font-size: .875rem; color: var(--accent); margin: 0; }
.row-body { font-size: .93rem; margin: .35rem 0 0; }

.prose-block { max-width: 68ch; }
.prose-block h3 { margin-top: 1.8rem; }
.prose-block h3:first-child { margin-top: 0; }

.gallery-grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.gallery-figure { margin: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.gallery-figure img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.gallery-figure figcaption { padding: .8rem 1rem 1rem; font-size: .875rem; }
.gallery-figure figcaption strong { display: block; color: var(--text); font-weight: 600; margin-bottom: .15rem; }
.gallery-figure figcaption span { color: var(--text-dim); font-size: .82rem; }

/* ══════════════════════════════════════════════════════════════════════
   CERTIFICATIONS + EDUCATION
   ══════════════════════════════════════════════════════════════════════ */
.cert-grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.cert-card {
  display: flex; gap: 1rem; align-items: flex-start;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 1.35rem 1.4rem;
  transition: border-color .25s var(--ease), transform .25s var(--ease);
}
.cert-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.cert-badge {
  display: grid; place-items: center; flex: none;
  width: 42px; height: 42px; border-radius: 10px;
  background: var(--accent-soft); color: var(--accent); font-size: 1.15rem;
}
.cert-card h3 { font-size: calc(1rem * var(--h-scale)); margin-bottom: .2rem; }
.cert-card p { margin: 0; font-size: .85rem; color: var(--text-dim); }
.cert-code { font-family: var(--font-mono); font-size: .78rem; color: var(--accent); }
.cert-verify { display: inline-flex; align-items: center; gap: .3rem; font-size: .82rem; margin-top: .35rem; }

.edu-list { display: grid; gap: var(--gap); }
.edu-card {
  display: grid; gap: .3rem;
  border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: var(--radius); background: var(--surface); padding: 1.5rem 1.6rem;
}
.edu-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem 1rem; }
.edu-top h3 { margin: 0; }
.edu-date { margin-left: auto; font-family: var(--font-mono); font-size: .8rem; color: var(--text-dim); }
.edu-card p { margin: 0; }
.edu-detail { font-family: var(--font-mono); font-size: .875rem; color: var(--text); }

/* ══════════════════════════════════════════════════════════════════════
   FOOTER
   ══════════════════════════════════════════════════════════════════════ */
.site-footer { border-top: 1px solid var(--border); background: var(--bg-alt); padding-block: clamp(3rem, 7vw, 4.5rem) 2rem; }
.footer-cta { max-width: 54ch; margin-bottom: 2.5rem; }
.footer-cta h2 { margin-bottom: .5rem; }
.footer-cta p { color: var(--text-dim); }

.contact-list {
  display: grid; gap: .75rem; margin-bottom: 2.75rem;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
}
.contact-list a {
  display: flex; align-items: center; gap: .8rem;
  padding: .9rem 1.1rem; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text-mid); font-size: .92rem;
  transition: border-color .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
}
.contact-list a:hover { border-color: var(--accent); color: var(--text); transform: translateY(-2px); }
.contact-list .icon { color: var(--accent); width: 1.15em; height: 1.15em; flex: none; }
.contact-list span { overflow-wrap: anywhere; }

.footer-bottom {
  display: flex; flex-wrap: wrap; gap: .5rem 1rem;
  justify-content: space-between; align-items: center;
  padding-top: 1.6rem; border-top: 1px solid var(--border);
  font-family: var(--font-mono); font-size: .82rem; color: var(--text-dim);
}
.footer-bottom p { margin: 0; }
.footer-bottom a { color: var(--text-dim); }
.footer-bottom a:hover { color: var(--accent); }

/* ══════════════════════════════════════════════════════════════════════
   PDF DIALOG
   ══════════════════════════════════════════════════════════════════════ */
dialog.pdf-dialog {
  width: min(560px, calc(100vw - 2rem));
  border: 1px solid var(--border-2); border-radius: var(--radius);
  background: var(--surface); color: var(--text-mid);
  padding: 0; box-shadow: var(--shadow);
}
dialog.pdf-dialog::backdrop { background: rgba(0,0,0,.55); backdrop-filter: blur(2px); }
.pdf-dialog form { padding: 1.5rem 1.6rem 1.2rem; margin: 0; }
.pdf-dialog h2 { font-size: calc(1.25rem * var(--h-scale)); margin-bottom: .3rem; }
.pdf-dialog > form > p { font-size: .875rem; color: var(--text-dim); }
.pdf-dialog fieldset { border: 0; padding: 0; margin: 1.2rem 0 0; }
.pdf-dialog legend {
  font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase;
  letter-spacing: .08em; color: var(--text-dim); padding: 0; margin-bottom: .55rem;
}
.pdf-opt {
  display: flex; gap: .7rem; align-items: flex-start;
  padding: .65rem .8rem; border: 1px solid var(--border);
  border-radius: var(--radius-sm); margin-bottom: .4rem; cursor: pointer;
  transition: border-color .2s var(--ease), background-color .2s var(--ease);
}
.pdf-opt:hover { border-color: var(--border-2); background: var(--surface-2); }
.pdf-opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.pdf-opt input { margin-top: .3rem; accent-color: var(--accent); flex: none; }
.pdf-opt strong { display: block; color: var(--text); font-size: .92rem; font-weight: 600; }
.pdf-opt span { font-size: .82rem; color: var(--text-dim); }
.pdf-paper { display: flex; gap: .4rem; }
.pdf-paper label {
  flex: 1; text-align: center; padding: .5rem; cursor: pointer;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-family: var(--font-mono); font-size: .8rem;
}
.pdf-paper label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.pdf-paper input { position: absolute; opacity: 0; pointer-events: none; }
.pdf-actions {
  display: flex; justify-content: flex-end; gap: .6rem;
  margin: 1.4rem -1.6rem -1.2rem; padding: 1rem 1.6rem 1.2rem;
  border-top: 1px solid var(--border);
}
.pdf-note { font-size: .8rem; color: var(--text-dim); margin: 1rem 0 0; }

/* ══════════════════════════════════════════════════════════════════════
   TOAST — download progress and failures
   ══════════════════════════════════════════════════════════════════════ */
.toast {
  position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%);
  z-index: 300; max-width: min(92vw, 52ch); margin: 0;
  padding: .75rem 1.05rem;
  background: var(--surface); color: var(--text-mid);
  border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm); box-shadow: var(--shadow);
  font-size: .875rem; line-height: 1.5;
}
.toast.is-error { border-left-color: var(--danger); }
.toast code {
  font-family: var(--font-mono); font-size: .85em; color: var(--text);
  background: var(--surface-2); padding: .1rem .3rem; border-radius: 4px;
}

/* ══════════════════════════════════════════════════════════════════════
   SCROLL REVEAL
   ══════════════════════════════════════════════════════════════════════ */
.reveal {
  opacity: 0; transform: translateY(18px);
  transition: opacity .7s var(--ease), transform .7s var(--ease);
  transition-delay: var(--delay, 0ms);
}
.reveal.is-visible { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  .reveal { opacity: 1; transform: none; }
  .sk::after { animation: none; }
}

/* ══════════════════════════════════════════════════════════════════════
   PRINT / PDF
   A separate resume document is built from the same data and swapped in
   for printing. Real text, real links, real page breaks — no rasterising.
   ══════════════════════════════════════════════════════════════════════ */
.print-root {
  --pr-text: #111; --pr-mid: #333; --pr-dim: #666; --pr-line: #c9c9c9;
  --pr-accent: var(--accent);
  display: none;
  background: #fff; color: var(--pr-text);
  font-family: var(--font-body); font-size: 10pt; line-height: 1.45;
}
.print-root h1, .print-root h2, .print-root h3 { color: var(--pr-text); letter-spacing: -0.01em; }
.print-root a { color: inherit; text-decoration: none; }

.pr-head { margin-bottom: 5mm; }
.pr-head h1 { font-size: 21pt; margin: 0 0 1mm; line-height: 1.1; }
.pr-title { font-size: 11pt; color: var(--pr-accent); font-weight: 600; margin: 0 0 2mm; }
.pr-contact { font-size: 8.6pt; color: var(--pr-mid); margin: 0; }
.pr-contact span::after { content: " · "; color: var(--pr-dim); }
.pr-contact span:last-child::after { content: ""; }
.pr-summary { font-size: 9.4pt; color: var(--pr-mid); margin: 3mm 0 0; max-width: 58em; }

.pr-sec { margin-top: 6mm; break-inside: auto; }
.pr-sec > h2 {
  font-size: 9pt; text-transform: uppercase; letter-spacing: .12em;
  margin: 0 0 2.5mm; padding-bottom: 1mm;
  border-bottom: .6pt solid var(--pr-line);
}
.pr-entry { margin-bottom: 3.6mm; break-inside: avoid; }
.pr-entry:last-child { margin-bottom: 0; }
.pr-entry-top { display: flex; align-items: baseline; gap: 3mm; }
.pr-entry-top h3 { font-size: 10.2pt; margin: 0; flex: 1; }
.pr-when { font-size: 8.4pt; color: var(--pr-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pr-where { font-size: 9pt; color: var(--pr-accent); font-weight: 600; margin: .4mm 0 1.2mm; }
.pr-where .pr-loc { color: var(--pr-dim); font-weight: 400; }
.pr-bullets { margin: 0; padding: 0; }
.pr-bullets li { position: relative; padding-left: 3.6mm; font-size: 9.2pt; margin-bottom: .9mm; color: var(--pr-mid); }
.pr-bullets li::before { content: "•"; position: absolute; left: 0; color: var(--pr-accent); }
.pr-bullets strong { color: var(--pr-text); }
.pr-tags { font-size: 8.2pt; color: var(--pr-dim); margin: 1mm 0 0; font-family: var(--font-mono); }
.pr-kv { font-size: 9.2pt; margin: 0 0 1.6mm; color: var(--pr-mid); break-inside: avoid; }
.pr-kv strong { color: var(--pr-text); }

.pr-body { display: block; }
.pr-rail { margin-top: 6mm; }

/* — Sidebar: contact, skills, certs and education in a left rail — */
.pdf-sidebar .pr-body { display: grid; grid-template-columns: 33% 1fr; gap: 0 7mm; }
.pdf-sidebar .pr-rail { order: -1; margin-top: 0; border-right: .6pt solid var(--pr-line); padding-right: 6mm; }
.pdf-sidebar .pr-rail .pr-sec:first-child { margin-top: 0; }
.pdf-sidebar .pr-main .pr-sec:first-child { margin-top: 0; }

/* — Classic: centred header, serif headings — */
.pdf-classic .pr-head { text-align: center; border-bottom: 1.2pt solid var(--pr-text); padding-bottom: 4mm; }
.pdf-classic .pr-summary { margin-inline: auto; text-align: center; }
.pdf-classic h1, .pdf-classic h2, .pdf-classic h3 { font-family: var(--font-display); }
.pdf-classic .pr-sec > h2 { text-align: center; border-bottom: 0; letter-spacing: .18em; }
.pdf-classic { line-height: 1.55; }

/* — Timeline: dates in a left gutter with a rule — */
.pdf-timeline .pr-entry { display: grid; grid-template-columns: 26mm 1fr; gap: 0 4mm; }
.pdf-timeline .pr-entry-top { display: block; }
.pdf-timeline .pr-when { grid-column: 1; grid-row: 1 / span 4; padding-top: .6mm; }
.pdf-timeline .pr-entry > :not(.pr-when) { grid-column: 2; border-left: .6pt solid var(--pr-line); padding-left: 4mm; margin-left: -.5mm; }
.pdf-timeline .pr-entry-top .pr-when { display: none; }

/* — Minimal: no colour, no rules, no chips — */
.pdf-minimal { --pr-accent: #111; }
.pdf-minimal .pr-sec > h2 { border-bottom: 0; padding-bottom: 0; letter-spacing: .16em; }
.pdf-minimal .pr-bullets li::before { content: "–"; }
.pdf-minimal .pr-tags { display: none; }
.pdf-minimal .pr-where { color: var(--pr-text); }

/* Screen-side print preview (used by admin.html's Preview tab) */
body.print-preview { background: #666; }
body.print-preview > *:not(.print-root) { display: none !important; }
body.print-preview .print-root {
  display: block; width: 210mm; min-height: 297mm;
  margin: 8mm auto; padding: 14mm;
  box-shadow: 0 4px 24px rgba(0,0,0,.4);
}
body.print-preview.paper-letter .print-root { width: 216mm; min-height: 279mm; }

@media print {
  body > *:not(.print-root) { display: none !important; }
  .print-root { display: block !important; }
  a[href^="http"]::after { content: ""; }
  .pr-entry, .pr-kv, .gallery-figure { break-inside: avoid; }
}
</style>
</head>

<script>
(function () {
  "use strict";

  /* ====================================================================
     0. MODE
        ?preview=1 inside an iframe → wait for data over postMessage
        (admin.html's Preview tab). Otherwise fetch data.json normally.
     ==================================================================== */
  const PREVIEW = window.parent !== window &&
                  new URLSearchParams(window.location.search).has("preview");
  const DATA_URL = "data.json";
  const TH = window.PortfolioThemes || null;
  if (!TH && window.console && console.warn) {
    console.warn("[portfolio] themes.js didn't load — falling back to the built-in Graphite palette. " +
                 "Make sure themes.js is committed next to index.html.");
  }

  let P = {}, profile = {}, EXPERIENCE = [], PROJECTS = [], SKILLS = [], CERTS = [], EDUCATION = [], CUSTOM = [];
  let TOTAL_MONTHS = 0, TOTAL_YEARS = "";
  let themeMode = "dark";
  let revealObserver = null, sectionObserver = null;
  let pdfChoice = { template: "compact", paper: "a4" };

  const arr = (v) => (Array.isArray(v) ? v.filter(Boolean) : []);

  /* ====================================================================
     1. OPTIONAL-SAFE HELPERS
     ==================================================================== */
  function has(v) {
    if (v == null || v === false) return false;
    if (Array.isArray(v)) return v.filter(has).length > 0;
    if (typeof v === "object") return Object.keys(v).length > 0;
    return String(v).trim() !== "";
  }

  function append(node, children) {
    children.forEach(function (child) {
      if (child == null || child === false || child === "" || child === true) return;
      if (Array.isArray(child)) return append(node, child);
      node.appendChild(child.nodeType ? child : document.createTextNode(String(child)));
    });
  }

  function el(tag, attrs) {
    const node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        const v = attrs[k];
        if (v == null || v === false) return;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k.slice(0, 2) === "on" && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
        else node.setAttribute(k, v === true ? "" : v);
      });
    }
    append(node, Array.prototype.slice.call(arguments, 2));
    return node;
  }

  const icon = (name) => (has(name) ? el("i", { class: "icon", "data-lucide": name, "aria-hidden": "true" }) : null);
  const clear = (node) => { while (node.firstChild) node.removeChild(node.firstChild); };

  /* An image field is { src, alt }. No src → nothing renders. No alt →
     treated as decorative (alt=""), which is correct for a bare photo. */
  function image(img, cls) {
    if (!img || !has(img.src)) return null;
    return el("img", {
      class: cls || null, src: img.src, alt: has(img.alt) ? img.alt : "",
      loading: "lazy", decoding: "async"
    });
  }

  const slug = (s) => String(s || "").toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "section";

  /* ====================================================================
     1b. TOAST + GUARDED RESUME DOWNLOAD
         A plain <a download> saves whatever bytes come back — including a
         404 page — under the .pdf name you asked for. That failure is
         invisible until someone opens the file, so check the response
         first and say what's wrong instead.
     ==================================================================== */
  const toast = document.getElementById("toast");
  let toastTimer = null;

  function showToast(msg, isError, ms) {
    if (toastTimer) { window.clearTimeout(toastTimer); toastTimer = null; }
    clear(toast);
    append(toast, Array.isArray(msg) ? msg : [msg]);
    toast.classList.toggle("is-error", !!isError);
    toast.setAttribute("role", isError ? "alert" : "status");
    toast.hidden = false;
    if (ms) toastTimer = window.setTimeout(function () { toast.hidden = true; }, ms);
  }
  function hideToast() {
    if (toastTimer) { window.clearTimeout(toastTimer); toastTimer = null; }
    toast.hidden = true;
  }

  function sameOrigin(url) {
    try { return new URL(url, window.location.href).origin === window.location.origin; }
    catch (e) { return false; }
  }
  function fileNameFrom(url) {
    try {
      const last = new URL(url, window.location.href).pathname.split("/").filter(Boolean).pop();
      return last ? decodeURIComponent(last) : "resume.pdf";
    } catch (e) { return "resume.pdf"; }
  }

  /* Keeps the real href so right-click → Save link as, middle-click and
     the no-JS case all still work; only intercepts a plain left-click. */
  function guardDownload(anchor, url) {
    if (!sameOrigin(url)) return anchor;     // cross-origin: `download` is ignored anyway
    anchor.addEventListener("click", function (e) {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      showToast("Preparing the PDF…", false, 0);

      fetch(url, { cache: "no-store" }).then(function (res) {
        const type = (res.headers.get("content-type") || "").toLowerCase();
        if (!res.ok) {
          throw new Error("There's no file at " + url + " (HTTP " + res.status +
            "). The PDF has to be committed to the repo at exactly that path — filenames are case-sensitive.");
        }
        if (type.indexOf("pdf") === -1) {
          throw new Error(url + " returned " + (type.split(";")[0] || "an unknown type") +
            " rather than a PDF. Check resumeUrl in data.json.");
        }
        return res.blob();
      }).then(function (blob) {
        const objUrl = URL.createObjectURL(blob);
        const tmp = el("a", { href: objUrl, download: fileNameFrom(url) });
        document.body.appendChild(tmp);
        tmp.click();
        document.body.removeChild(tmp);
        window.setTimeout(function () { URL.revokeObjectURL(objUrl); }, 4000);
        hideToast();
      }).catch(function (err) {
        // A TypeError here means the request never completed (offline, CORS,
        // file://). That's not evidence the file is missing — let the browser try.
        if (err && err.name === "TypeError") { hideToast(); window.location.href = url; return; }
        showToast(String((err && err.message) || err), true, 12000);
      });
    });
    return anchor;
  }

  /* ====================================================================
     2. DATES
     ==================================================================== */
  const MONTHS = ["January","February","March","April","May","June",
                  "July","August","September","October","November","December"];
  const SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function parseYM(value) {
    if (!has(value)) return null;
    const m = String(value).trim().match(/^(\d{4})(?:-(\d{1,2}))?/);
    if (!m) return null;
    return { y: +m[1], m: m[2] ? Math.min(12, Math.max(1, +m[2])) : null };
  }

  const ymIndex = (d) => d.y * 12 + ((d.m || 1) - 1);

  function fmtYM(value, short) {
    const d = parseYM(value);
    if (!d) return has(value) ? String(value).trim() : "";
    const names = short ? SHORT : MONTHS;
    return d.m ? names[d.m - 1] + " " + d.y : String(d.y);
  }

  function fmtRange(start, end, short) {
    const s = fmtYM(start, short);
    const e = has(end) ? fmtYM(end, short) : "Present";
    if (!s) return has(end) ? e : "";
    return s + " – " + e;
  }

  function monthsBetween(start, end) {
    const s = parseYM(start);
    if (!s) return 0;
    const now = new Date();
    const e = has(end) ? parseYM(end) : { y: now.getFullYear(), m: now.getMonth() + 1 };
    if (!e) return 0;
    return Math.max(0, ymIndex(e) - ymIndex(s)) + 1;
  }

  function fmtDuration(months) {
    if (!months) return "";
    const y = Math.floor(months / 12), m = months % 12, out = [];
    if (y) out.push(y + " yr");
    if (m) out.push(m + " mo");
    return out.join(" ");
  }

  /* Total experience: earliest startDate → today. Never goes stale.
     One decimal, floored (52 mo → "4.3"). Want a whole number? Change
     the marked line. */
  function computeTotals() {
    const starts = EXPERIENCE.map((j) => parseYM(j.startDate)).filter(Boolean);
    if (!starts.length) { TOTAL_MONTHS = 0; TOTAL_YEARS = ""; return; }
    const earliest = starts.reduce((a, b) => (ymIndex(a) <= ymIndex(b) ? a : b));
    TOTAL_MONTHS = monthsBetween(earliest.m ? earliest.y + "-" + earliest.m : String(earliest.y), null);
    TOTAL_YEARS = TOTAL_MONTHS
      ? (Math.floor((TOTAL_MONTHS / 12) * 10) / 10).toFixed(1).replace(/\.0$/, "")   // ← rounding
      : "";
  }

  /* ====================================================================
     3. TEXT — {{years}} / {{months}} tokens and **bold** spans
     ==================================================================== */
  function tokens(str) {
    return String(str)
      .replace(/\{\{\s*years\s*\}\}/g, TOTAL_YEARS)
      .replace(/\{\{\s*months\s*\}\}/g, String(TOTAL_MONTHS));
  }

  function rich(str, doc) {
    if (!has(str)) return [];
    const d = doc || document;
    return tokens(str).split(/\*\*([^*]+)\*\*/g).map(function (part, i) {
      if (!part) return null;
      if (i % 2 === 0) return d.createTextNode(part);
      const strong = d.createElement("strong");
      strong.textContent = part;
      return strong;
    });
  }

  const plain = (str) => (has(str) ? tokens(str).replace(/\*\*/g, "") : "");

  function byStartDesc(list, key) {
    return list.slice().sort(function (a, b) {
      const A = parseYM(a[key]), B = parseYM(b[key]);
      if (!A && !B) return 0;
      if (!A) return 1;
      if (!B) return -1;
      return ymIndex(B) - ymIndex(A);
    });
  }

  /* ====================================================================
     4. SHARED PIECES
     ==================================================================== */
  function sectionHead(eyebrow, title, id, blurb) {
    return el("div", { class: "section-head reveal" },
      has(eyebrow) && el("p", { class: "eyebrow", text: eyebrow }),
      el("h2", { id: id, text: title }),
      has(blurb) && el("p", null, tokens(blurb))
    );
  }

  function chipList(items, label) {
    if (!has(items)) return null;
    return el("ul", { class: "chips", role: "list", "aria-label": label || null },
      arr(items).map((t) => el("li", { class: "chip", text: t })));
  }

  function linkRow(links, cls) {
    const usable = arr(links).filter((l) => has(l.url));
    if (!usable.length) return null;
    return el("p", { class: cls },
      usable.map((l) => el("a", { href: l.url, target: "_blank", rel: "noopener noreferrer" },
        icon(l.icon || "external-link"), l.label || l.url)));
  }

  function wrap(id, cls, labelledBy, children) {
    return el("section", { id: id, class: cls, "aria-labelledby": labelledBy },
      el("div", { class: "container" }, children));
  }

  /* ====================================================================
     5. SECTION RENDERERS
     ==================================================================== */
  function renderHero() {
    const stats = [
      has(TOTAL_YEARS) && { n: TOTAL_YEARS, label: "Years on the ServiceNow platform" },
      PROJECTS.length > 0 && { n: PROJECTS.length + "", label: "Implementations delivered" },
      CERTS.length > 0 && { n: CERTS.length + "", label: "ServiceNow certifications" },
      SKILLS.length > 0 && { n: SKILLS.reduce((s, g) => s + arr(g.items).length, 0) + "", label: "Platform capabilities" }
    ].filter(Boolean);

    const canPrint = has(profile.name) && (EXPERIENCE.length || PROJECTS.length || SKILLS.length);

    return el("section", { id: "top", class: "hero", "aria-labelledby": "hero-title" },
      el("div", { class: "container" },
        image(profile.photo, "hero-photo reveal"),
        has(profile.status) && el("p", { class: "hero-tag reveal" },
          el("span", { class: "pulse", "aria-hidden": "true" }), profile.status),

        el("h1", { id: "hero-title", class: "reveal", style: "--delay:60ms", text: profile.name || "" }),
        has(profile.title) && el("p", { class: "hero-role reveal", style: "--delay:120ms", text: profile.title }),
        has(profile.tagline) && el("p", { class: "hero-pitch reveal", style: "--delay:180ms" }, rich(profile.tagline)),

        (has(profile.location) || CERTS.length > 0) && el("p", { class: "hero-meta reveal", style: "--delay:220ms" },
          has(profile.location) && el("span", null, icon("map-pin"), profile.location),
          CERTS.length > 0 && el("span", null, icon("badge-check"),
            CERTS.map((c) => c.abbr || c.name).filter(has).join(" · "))
        ),

        (has(profile.email) || has(profile.resumeUrl) || canPrint) &&
        el("div", { class: "hero-cta reveal", style: "--delay:280ms" },
          has(profile.email) && el("a", { class: "btn btn-primary", href: "mailto:" + profile.email },
            icon("mail"), "Get in touch"),
          has(profile.resumeUrl) && guardDownload(
            el("a", { class: "btn btn-ghost", href: profile.resumeUrl, download: true },
              icon("download"), "Download Resume"),
            profile.resumeUrl),
          canPrint && el("button", { class: "btn btn-ghost", type: "button", onclick: openPdfDialog },
            icon("printer"), "Save as PDF")
        ),

        stats.length > 0 && el("dl", { class: "hero-stats reveal", style: "--delay:340ms" },
          stats.map((s) => el("div", null, el("dt", { text: s.n }), el("dd", { text: s.label }))))
      )
    );
  }

  function renderAbout() {
    const current = EXPERIENCE.filter((j) => !has(j.endDate))[0] || byStartDesc(EXPERIENCE, "startDate")[0];
    const facts = [
      has(profile.location) && ["Based in", profile.location],
      current && has(current.company) && ["Current role", [current.role, current.company].filter(has).join(", ")],
      SKILLS.length > 0 && ["Focus areas", SKILLS.map((g) => g.category).filter(has).slice(0, 3).join(" · ")],
      CERTS.length > 0 && ["Certified", CERTS.map((c) => c.abbr || c.name).filter(has).join(", ")],
      TOTAL_MONTHS > 0 && ["Experience", fmtDuration(TOTAL_MONTHS)]
    ].filter(Boolean);

    return wrap("about", "section-alt", "about-title", [
      sectionHead("About", "Platform engineering, not just configuration", "about-title"),
      el("div", { class: "about-grid" },
        el("div", { class: "about-body reveal" }, arr(profile.about).map((p) => el("p", null, rich(p)))),
        facts.length > 0 && el("aside", { class: "facts reveal", style: "--delay:120ms", "aria-label": "Quick facts" },
          el("h3", { text: "Quick facts" }),
          el("dl", null, facts.map((f) => el("div", null, el("dt", { text: f[0] }), el("dd", { text: f[1] }))))
        )
      )
    ]);

  function renderSkills() {
    return wrap("skills", null, "skills-title", [
      sectionHead("Skills", "What I work with", "skills-title",
        "Grouped by where it sits in the stack — platform modules, the code underneath, and the tooling around it."),
      el("div", { class: "skill-grid" },
        SKILLS.map((group, i) =>
          el("article", { class: "skill-card reveal", style: "--delay:" + i * 80 + "ms" },

      )
    ]);

  function renderExperience() {
    return wrap("experience", "section-alt", "experience-title", [
      sectionHead("Experience", "Where I've built things", "experience-title"),
      el("ol", { class: "timeline" },
        byStartDesc(EXPERIENCE, "startDate").map(function (job, i) {
          const current = !has(job.endDate) && has(job.startDate);
          const range = fmtRange(job.startDate, job.endDate);
          const dur = fmtDuration(monthsBetween(job.startDate, job.endDate));
          const meta = [
            has(job.company) && el("span", { class: "tl-company", text: job.company }),
            has(dur) && el("span", { class: "tl-dur", text: dur }),
            has(job.location) && el("span", { text: job.location })
          ].filter(Boolean);

          return el("li", {
              class: "tl-item reveal" + (current ? " is-current" : ""),
              style: "--delay:" + i * 100 + "ms"
            },
            el("div", { class: "tl-head" },
              el("h3", { text: job.role || job.company || "Role" }),
              has(range) && el("p", { class: "tl-date", text: range })),
            meta.length > 0 && el("p", { class: "tl-sub" },
              meta.reduce((acc, node, idx) => acc.concat(idx ? [el("span", { class: "tl-sep", text: "·" }), node] : [node]), [])),
            has(job.summary) && el("p", { class: "tl-summary" }, rich(job.summary)),
            has(job.highlights) && el("ul", { class: "tl-list", role: "list" },
              arr(job.highlights).map((h) => el("li", null, rich(h)))),
            chipList(job.tech, (job.company || "Role") + " technologies")
          );
        })
      )
    ]);
  }

  function renderProjects() {
    const ordered = PROJECTS.slice().sort((a, b) => (b.featured === true) - (a.featured === true));

    const counts = new Map();
    ordered.forEach((p) => arr(p.tech).forEach((t) => counts.set(t, (counts.get(t) || 0) + 1)));
    const techs = Array.from(counts.keys()).sort((a, b) => counts.get(b) - counts.get(a) || a.localeCompare(b));

    const cards = [];
    const grid = el("div", { class: "project-grid" },
      ordered.map(function (p, i) {
        const pap = [
          has(p.problem) && ["Problem", p.problem, ""],
          has(p.approach) && ["Approach", p.approach, ""],
          has(p.result) && ["Result", p.result, "is-result"]
        ].filter(Boolean);

        const node = el("article", {
            class: "project-card reveal" + (p.featured ? " is-featured" : ""),
            style: "--delay:" + Math.min(i, 4) * 80 + "ms"
          },
          image(p.image, "project-cover"),
          el("div", { class: "project-top" },
            el("span", { class: "project-num", text: String(i + 1).padStart(2, "0") }),
            p.featured === true && el("span", { class: "featured-flag", text: "Featured" })),
          el("h3", { text: p.title || "Project" }),
          has(p.blurb) && el("p", { class: "project-blurb" }, rich(p.blurb)),
          pap.length > 0 && el("dl", { class: "pap" },
            pap.map((row) => el("div", { class: row[2] || null },
              el("dt", { text: row[0] }), el("dd", null, rich(row[1]))))),
          linkRow(p.links, "project-links"),
          chipList(p.tech, (p.title || "Project") + " technologies")
        );

        cards.push({ node: node, tech: arr(p.tech) });
        return node;
      })
    );

    const status = el("p", { class: "filter-status", role: "status", "aria-live": "polite" });
    const buttons = [];

    function applyFilter(tech, pressed) {
      let shown = 0;
      cards.forEach(function (c) {
        const match = tech === null || c.tech.indexOf(tech) !== -1;
        c.node.hidden = !match;
        if (match) shown++;
      });
      buttons.forEach((b) => b.setAttribute("aria-pressed", String(b === pressed)));
      status.textContent = "Showing " + shown + " of " + cards.length +
        " projects" + (tech ? " tagged “" + tech + "”" : "");
    }

    const bar = techs.length > 0 && el("div", {
        class: "filter-bar reveal", role: "group", "aria-label": "Filter projects by technology"
      },
      [null].concat(techs).map(function (tech) {
        const btn = el("button", {
          type: "button", class: "filter-btn",
          "aria-pressed": String(tech === null),
          text: tech === null ? "All" : tech,
          onclick: function () { applyFilter(tech, btn); }
        });
        buttons.push(btn);
        return btn;
      })
    );

    if (techs.length) applyFilter(null, buttons[0]);

    return wrap("projects", null, "projects-title", [
      sectionHead("Projects", "Selected implementations", "projects-title",
        "Each one framed the way I think about delivery: what was broken, what I built, and what changed afterwards."),
      bar,
      techs.length > 0 && status,
      grid
    ]);
  }

  function renderCertifications() {

      sectionHead("Certifications", "Certified and current", "certifications-title"),
      el("div", { class: "cert-grid" },
        CERTS.map(function (c, i) {

          return el("article", { class: "cert-card reveal", style: "--delay:" + i * 80 + "ms" },

            el("div", null,
              el("h3", { text: c.name || "Certification" }),

                has(c.abbr) && el("span", { class: "cert-code", text: c.abbr }),

              has(c.credentialUrl) && el("a", {

                }, icon("external-link"), "Verify credential",

      el("div", { class: "edu-list" },
        byStartDesc(EDUCATION, "startYear").map(function (e, i) {
          const range = fmtRange(e.startYear, e.endYear);
          return el("article", { class: "edu-card reveal", style: "--delay:" + i * 80 + "ms" },
            el("div", { class: "edu-top" },
              el("h3", { text: e.degree || e.institution || "Education" }),
