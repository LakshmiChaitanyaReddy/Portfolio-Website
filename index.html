  /* ── Custom sections: five layouts, chosen per section in data.json ── */
  function renderCustomSection(sec, id) {
    const items = arr(sec.items);
    const layout = sec.layout || "cards";
    const titleId = id + "-title";
    const head = sectionHead(sec.eyebrow || sec.title, sec.title || "Section", titleId, sec.blurb);
    let bodyNode;

    if (layout === "timeline") {
      bodyNode = el("ol", { class: "timeline" }, items.map(function (it, i) {
        return el("li", { class: "tl-item reveal", style: "--delay:" + Math.min(i, 6) * 90 + "ms" },
          el("div", { class: "tl-head" },
            el("h3", { text: it.title || "Entry" }),
            has(it.meta) && el("p", { class: "tl-date", text: it.meta })),
          has(it.subtitle) && el("p", { class: "tl-sub" }, el("span", { class: "tl-company", text: it.subtitle })),
          has(it.body) && el("p", { class: "tl-summary" }, rich(it.body)),
          has(it.bullets) && el("ul", { class: "tl-list", role: "list" },
            arr(it.bullets).map((b) => el("li", null, rich(b)))),
          linkRow(it.links, "custom-links"),
          chipList(it.tags, it.title));
      }));

    } else if (layout === "list") {
      bodyNode = el("div", { class: "row-list" }, items.map(function (it, i) {
        return el("article", { class: "row-item reveal", style: "--delay:" + Math.min(i, 8) * 60 + "ms" },
          el("div", { class: "row-top" },
            el("h3", { text: it.title || "Entry" }),
            has(it.meta) && el("p", { class: "row-meta", text: it.meta })),
          has(it.subtitle) && el("p", { class: "row-sub", text: it.subtitle }),
          has(it.body) && el("p", { class: "row-body" }, rich(it.body)),
          has(it.bullets) && el("ul", { class: "tl-list", role: "list", style: "margin-top:.5rem" },
            arr(it.bullets).map((b) => el("li", null, rich(b)))),
          linkRow(it.links, "custom-links"),
          chipList(it.tags, it.title));
      }));

    } else if (layout === "prose") {
      bodyNode = el("div", { class: "prose-block about-body reveal" }, items.map(function (it) {
        return [
          has(it.title) && el("h3", { text: it.title }),
          has(it.subtitle) && el("p", { class: "custom-sub", text: it.subtitle }),
          has(it.body) && el("p", null, rich(it.body)),
          has(it.bullets) && el("ul", { class: "tl-list", role: "list" },
            arr(it.bullets).map((b) => el("li", null, rich(b)))),
          linkRow(it.links, "custom-links")
        ];
      }));

    } else if (layout === "gallery") {
      bodyNode = el("div", { class: "gallery-grid" }, items.map(function (it, i) {
        const img = image(it.image, null);
        if (!img && !has(it.title)) return null;
        return el("figure", { class: "gallery-figure reveal", style: "--delay:" + Math.min(i, 8) * 70 + "ms" },
          img,
          (has(it.title) || has(it.body) || has(it.meta)) && el("figcaption", null,
            has(it.title) && el("strong", { text: it.title }),
            has(it.body) && el("span", { text: plain(it.body) }),
            has(it.meta) && el("span", { text: (has(it.body) ? " · " : "") + it.meta })));
      }).filter(Boolean));

    } else {   // cards
      bodyNode = el("div", { class: "custom-grid" }, items.map(function (it, i) {
        return el("article", { class: "custom-card reveal", style: "--delay:" + Math.min(i, 6) * 80 + "ms" },
          image(it.image, "custom-cover"),
          has(it.meta) && el("p", { class: "custom-meta", text: it.meta }),
          el("h3", { text: it.title || "Entry" }),
          has(it.subtitle) && el("p", { class: "custom-sub", text: it.subtitle }),
          has(it.body) && el("p", { class: "custom-body" }, rich(it.body)),
          has(it.bullets) && el("ul", { class: "tl-list", role: "list", style: "margin-bottom:.9rem" },
            arr(it.bullets).map((b) => el("li", null, rich(b)))),
          linkRow(it.links, "custom-links"),
          chipList(it.tags, it.title));
      }));
    }

    return wrap(id, sec.altBackground === true ? "section-alt" : null, titleId, [head, bodyNode]);
  }

  function renderContact(footer) {
    const items = [
      has(profile.email) && { href: "mailto:" + profile.email, icon: "mail", text: profile.email },
      has(profile.phone) && { href: "tel:" + String(profile.phone).replace(/[^\d+]/g, ""), icon: "phone", text: profile.phone }
    ].filter(Boolean)
     .concat(arr(profile.links).filter((l) => has(l.url)).map((l) => ({
        href: l.url, icon: l.icon || "link", text: l.label || l.url, external: true })))
     .concat(has(profile.resumeUrl)
        ? [{ href: profile.resumeUrl, icon: "file-down", text: "Download Resume (PDF)", download: true, guard: true }] : []);

    append(footer, [el("div", { class: "container" },
      el("div", { class: "footer-cta reveal" },
        el("p", { class: "eyebrow", text: "Contact" }),
        el("h2", { id: "contact-title", text: "Let's talk ServiceNow" }),
        el("p", { text: "Happy to discuss platform work, integration design or a role — the inbox is the fastest way to reach me." })),
      items.length > 0 && el("ul", { class: "contact-list reveal", role: "list", style: "--delay:80ms" },
        items.map(function (it) {
          const a = el("a", {
            href: it.href,
            target: it.external ? "_blank" : null,
            rel: it.external ? "noopener noreferrer" : null,
            download: it.download ? true : null
          }, icon(it.icon), el("span", { text: it.text }));
          return el("li", null, it.guard ? guardDownload(a, it.href) : a);
        })),
      el("div", { class: "footer-bottom" },
        el("p", { text: "© " + new Date().getFullYear() + (has(profile.name) ? " " + profile.name : "") }),
        el("a", { href: "#top", text: "Back to top ↑" }))
    )]);
    footer.setAttribute("aria-labelledby", "contact-title");
    footer.hidden = false;
  }

  /* ====================================================================
     6. SECTION LIST — built-ins + custom, ordered and filtered by data
     ==================================================================== */
  function buildSectionList() {
    const builtins = [
      { id: "about",          label: "About",          when: () => has(profile.about), render: renderAbout },
      { id: "skills",         label: "Skills",         when: () => SKILLS.length > 0,  render: renderSkills },
      { id: "experience",     label: "Experience",     when: () => EXPERIENCE.length > 0, render: renderExperience },
      { id: "projects",       label: "Projects",       when: () => PROJECTS.length > 0, render: renderProjects },
      { id: "certifications", label: "Certifications", when: () => CERTS.length > 0,   render: renderCertifications },
      { id: "education",      label: "Education",      when: () => EDUCATION.length > 0, render: renderEducation }
    ].filter(function (s) { try { return s.when(); } catch (e) { return false; } });

    const used = {};
    builtins.forEach((b) => { used[b.id] = true; });

    const customs = CUSTOM.filter((s) => has(s.title) && arr(s.items).length > 0).map(function (sec) {
      let id = slug(sec.id || sec.title);
      while (used[id]) id = id + "-x";          // never collide with a built-in
      used[id] = true;
      return { id: id, label: sec.title, custom: sec, render: () => renderCustomSection(sec, id) };
    });

    const hidden = arr(P.hiddenSections).map(String);
    const order = arr(P.sectionOrder).map(String);
    const rank = (s) => {
      const i = order.indexOf(s.id);
      return i === -1 ? 9999 : i;               // unlisted sections keep natural order, at the end
    };

    const all = builtins.concat(customs)
      .filter((s) => hidden.indexOf(s.id) === -1)
      .map((s, i) => ({ s: s, i: i }))
      .sort((a, b) => (rank(a.s) - rank(b.s)) || (a.i - b.i))
      .map((x) => x.s);

    const contactHasData = has(profile.email) || has(profile.phone) || has(profile.links);
    if (contactHasData && hidden.indexOf("contact") === -1) {
      all.push({ id: "contact", label: "Contact", footer: true });   // always last: it is the footer
    }
    return all;
  }

  /* ====================================================================
     7. HEAD — title, meta, Open Graph, JSON-LD (schema.org Person)
     ==================================================================== */
  function setMeta(selector, attr, value) {
    const node = document.head.querySelector(selector);
    if (node && has(value)) node.setAttribute(attr, value);
  }

  function renderHead() {
    const who = profile.shortName || profile.name;
    const desc = plain(profile.tagline);
    const url = has(profile.siteUrl) ? String(profile.siteUrl).replace(/\/$/, "") : "";
    const img = has(profile.ogImage) ? (url ? url + "/" + profile.ogImage : profile.ogImage) : "";

    if (has(who) && has(profile.title)) document.title = who + " | " + profile.title;

    setMeta('meta[name="description"]', "content", desc);
    setMeta('meta[name="author"]', "content", profile.name);
    setMeta('meta[property="og:title"]', "content", document.title);
    setMeta('meta[property="og:description"]', "content", desc);
    setMeta('meta[property="og:url"]', "content", url);
    setMeta('meta[property="og:image"]', "content", img);
    setMeta('meta[name="twitter:title"]', "content", document.title);
    setMeta('meta[name="twitter:description"]', "content", desc);
    setMeta('meta[name="twitter:image"]', "content", img);
    setMeta('link[rel="canonical"]', "href", url);

    const loc = String(profile.location || "").split(",").map((s) => s.trim()).filter(Boolean);
    const current = EXPERIENCE.filter((j) => !has(j.endDate))[0];
    const person = { "@context": "https://schema.org", "@type": "Person" };

    if (has(profile.name)) person.name = profile.name;
    if (has(profile.title)) person.jobTitle = profile.title;
    if (has(desc)) person.description = desc;
    if (has(profile.email)) person.email = "mailto:" + profile.email;
    if (has(profile.phone)) person.telephone = profile.phone;
    if (has(url)) person.url = url;
    if (img) person.image = img;
    else if (profile.photo && has(profile.photo.src)) person.image = profile.photo.src;
    if (loc.length) {
      person.address = { "@type": "PostalAddress", addressLocality: loc[0] };
      if (loc[1]) person.address.addressCountry = loc[1];
    }
    const sameAs = arr(profile.links).map((l) => l.url).filter((u) => has(u) && /^https?:/i.test(u));
    if (sameAs.length) person.sameAs = sameAs;
    if (current && has(current.company)) person.worksFor = { "@type": "Organization", name: current.company };
    const knows = SKILLS.reduce((a, g) => a.concat(arr(g.items)), []);
    if (knows.length) person.knowsAbout = knows;
    const school = byStartDesc(EDUCATION, "startYear")[0];
    if (school && has(school.institution)) person.alumniOf = { "@type": "EducationalOrganization", name: school.institution };
    if (CERTS.length) {
      person.hasCredential = CERTS.filter((c) => has(c.name)).map(function (c) {
        const cred = { "@type": "EducationalOccupationalCredential", name: c.name };
        if (has(c.issuer)) cred.recognizedBy = { "@type": "Organization", name: c.issuer };
        if (has(c.credentialUrl)) cred.url = c.credentialUrl;
        return cred;
      });
    }

    const old = document.getElementById("ld-person");
    if (old) old.remove();
    document.head.appendChild(el("script", { type: "application/ld+json", id: "ld-person", text: JSON.stringify(person) }));
  }

  /* ====================================================================
     8. THEME
     ==================================================================== */
  function applyCurrentTheme() {
    document.documentElement.setAttribute("data-theme", themeMode);
    if (!TH) return;
    const resolved = TH.resolveTheme(P.theme || {});
    TH.applyTheme(document, resolved, themeMode);
    const meta = document.head.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", (resolved.vars[themeMode] || {})["--bg"] || "#0d1117");
    const btn = document.getElementById("theme-toggle");
    if (btn) {
      btn.setAttribute("aria-pressed", String(themeMode === "light"));
      btn.setAttribute("aria-label", themeMode === "dark" ? "Switch to light theme" : "Switch to dark theme");
    }
  }

  function setMode(next) {
    themeMode = next === "light" ? "light" : "dark";
    applyCurrentTheme();
  }

  /* ====================================================================
     9. PRINT DOCUMENT — a real resume built from the same data
     ==================================================================== */
  const printRoot = document.getElementById("print-root");

  function prSection(title, children) {
    const kids = children.filter(Boolean);
    if (!kids.length) return null;
    return el("section", { class: "pr-sec" }, el("h2", { text: title }), kids);
  }

  function buildPrintDoc(template, paper) {
    const exclude = arr((P.pdf || {}).exclude).map(String);
    const skip = (id) => exclude.indexOf(id) !== -1;

    clear(printRoot);
    printRoot.className = "print-root pdf-" + (template || "compact");

    const contact = [
      has(profile.location) && profile.location,
      has(profile.email) && profile.email,
      has(profile.phone) && profile.phone
    ].filter(Boolean).concat(arr(profile.links).filter((l) => has(l.url)).map((l) => l.label || l.url));

    const head = el("header", { class: "pr-head" },
      el("h1", { text: profile.name || "" }),
      has(profile.title) && el("p", { class: "pr-title", text: profile.title }),
      contact.length > 0 && el("p", { class: "pr-contact" }, contact.map((c) => el("span", { text: c }))),
      has(profile.tagline) && el("p", { class: "pr-summary", text: plain(profile.tagline) })
    );

    /* — main column — */
    const experience = !skip("experience") && EXPERIENCE.length > 0 && prSection("Experience",
      byStartDesc(EXPERIENCE, "startDate").map(function (job) {
        const where = [job.company, job.location].filter(has);
        return el("article", { class: "pr-entry" },
          el("span", { class: "pr-when", text: fmtRange(job.startDate, job.endDate, true) }),
          el("div", { class: "pr-entry-top" },
            el("h3", { text: job.role || job.company || "Role" }),
            el("span", { class: "pr-when", text: fmtRange(job.startDate, job.endDate, true) })),
          where.length > 0 && el("p", { class: "pr-where" },
            has(job.company) && el("span", { text: job.company }),
            has(job.location) && el("span", { class: "pr-loc", text: (has(job.company) ? " · " : "") + job.location })),
          has(job.summary) && el("p", { class: "pr-kv" }, rich(job.summary)),
          has(job.highlights) && el("ul", { class: "pr-bullets" }, arr(job.highlights).map((h) => el("li", null, rich(h)))),
          has(job.tech) && el("p", { class: "pr-tags", text: arr(job.tech).join(" · ") })
        );
      }));

    const projects = !skip("projects") && PROJECTS.length > 0 && prSection("Selected projects",
      PROJECTS.slice().sort((a, b) => (b.featured === true) - (a.featured === true)).map(function (p) {
        const line = [p.result, p.approach, p.blurb].filter(has)[0];
        return el("article", { class: "pr-entry" },
          el("span", { class: "pr-when", text: "" }),
          el("div", { class: "pr-entry-top" }, el("h3", { text: p.title || "Project" })),
          has(line) && el("p", { class: "pr-kv" }, rich(line)),
          has(p.tech) && el("p", { class: "pr-tags", text: arr(p.tech).join(" · ") }));
      }));

    const customMain = CUSTOM.filter((s) => has(s.title) && arr(s.items).length && !skip(slug(s.id || s.title)))
      .map(function (sec) {
        return prSection(sec.title, arr(sec.items).map(function (it) {
          return el("article", { class: "pr-entry" },
            el("span", { class: "pr-when", text: it.meta || "" }),
            el("div", { class: "pr-entry-top" },
              el("h3", { text: it.title || "Entry" }),
              has(it.meta) && el("span", { class: "pr-when", text: it.meta })),
            has(it.subtitle) && el("p", { class: "pr-where", text: it.subtitle }),
            has(it.body) && el("p", { class: "pr-kv" }, rich(it.body)),
            has(it.bullets) && el("ul", { class: "pr-bullets" }, arr(it.bullets).map((b) => el("li", null, rich(b)))),
            has(it.tags) && el("p", { class: "pr-tags", text: arr(it.tags).join(" · ") }));
        }));
      }).filter(Boolean);

    /* — rail column — */
    const skills = !skip("skills") && SKILLS.length > 0 && prSection("Skills",
      SKILLS.map((g) => el("p", { class: "pr-kv" },
        el("strong", { text: (g.category || "Skills") + ": " }), arr(g.items).join(", "))));

    const certs = !skip("certifications") && CERTS.length > 0 && prSection("Certifications",
      CERTS.map((c) => el("p", { class: "pr-kv" },
        el("strong", { text: c.name || "" }),
        [c.issuer, c.year].filter(has).length ? el("span", { text: " — " + [c.issuer, c.year].filter(has).join(", ") }) : null)));

    const education = !skip("education") && EDUCATION.length > 0 && prSection("Education",
      byStartDesc(EDUCATION, "startYear").map((e) => el("p", { class: "pr-kv" },
        el("strong", { text: e.degree || e.institution || "" }),
        has(e.degree) && has(e.institution) ? el("span", { text: " — " + e.institution }) : null,
        el("span", { text: [fmtRange(e.startYear, e.endYear), e.detail].filter(has).map((x) => " · " + x).join("") }))));

    append(printRoot, [
      head,
      el("div", { class: "pr-body" },
        el("div", { class: "pr-main" }, [experience, projects].concat(customMain).filter(Boolean)),
        el("aside", { class: "pr-rail" }, [skills, certs, education].filter(Boolean)))
    ]);

    // @page size can't come from a custom property, so it gets its own tag.
    let pageStyle = document.getElementById("page-size");
    if (!pageStyle) {
      pageStyle = el("style", { id: "page-size" });
      document.head.appendChild(pageStyle);
    }
    pageStyle.textContent = "@page { size: " + (paper === "letter" ? "Letter" : "A4") + "; margin: 14mm; }";
  }

  /* ── The dialog ── */
  function openPdfDialog() {
    const dlg = document.getElementById("pdf-dialog");
    const templates = (TH && TH.PDF_TEMPLATES) || [{ id: "compact", name: "Compact", blurb: "One column." }];
    clear(dlg);

    const form = el("form", { method: "dialog" },
      el("h2", { id: "pdf-dialog-title", text: "Save as PDF" }),
      el("p", { text: "Your content, re-laid-out as a resume. Pick a layout, then choose “Save as PDF” as the destination in the print dialog." }),
      el("fieldset", null,
        el("legend", { text: "Layout" }),
        templates.map((t) => el("label", { class: "pdf-opt" },
          el("input", { type: "radio", name: "tpl", value: t.id, checked: t.id === pdfChoice.template }),
          el("span", null, el("strong", { text: t.name }), el("span", { text: t.blurb }))))),
      el("fieldset", null,
        el("legend", { text: "Paper" }),
        el("div", { class: "pdf-paper" },
          [["a4", "A4"], ["letter", "US Letter"]].map((p) => el("label", null,
            el("input", { type: "radio", name: "paper", value: p[0], checked: p[0] === pdfChoice.paper }),
            p[1])))),
      el("p", { class: "pdf-note", text: "Tip: turn off “Headers and footers” in the print dialog for a clean page." }),
      el("div", { class: "pdf-actions" },
        el("button", { class: "btn btn-ghost", type: "button", value: "cancel",
          onclick: function () { dlg.close("cancel"); } }, "Cancel"),
        el("button", { class: "btn btn-primary", type: "submit", value: "print" }, icon("printer"), "Open print dialog"))
    );

    form.addEventListener("submit", function () {
      const tpl = form.querySelector('input[name="tpl"]:checked');
      const paper = form.querySelector('input[name="paper"]:checked');
      pdfChoice = { template: tpl ? tpl.value : "compact", paper: paper ? paper.value : "a4" };
      buildPrintDoc(pdfChoice.template, pdfChoice.paper);
      window.setTimeout(function () { window.print(); }, 60);
    });

    dlg.appendChild(form);
    drawIcons();
    if (typeof dlg.showModal === "function") dlg.showModal();
    else { buildPrintDoc(pdfChoice.template, pdfChoice.paper); window.print(); }
  }

  /* ====================================================================
     10. RENDER — safe to call repeatedly (the Preview tab does exactly that)
     ==================================================================== */
  const main = document.getElementById("main");
  const navList = document.getElementById("nav-links");
  const mobileList = document.getElementById("mobile-links");
  const footer = document.getElementById("contact");
  const brand = document.getElementById("brand");
  const loadStatus = document.getElementById("load-status");

  function render(data) {
    P = data && typeof data === "object" ? data : {};
    profile = P.profile && typeof P.profile === "object" ? P.profile : {};
    EXPERIENCE = arr(P.experience);
    PROJECTS   = arr(P.projects);
    SKILLS     = arr(P.skills);
    CERTS      = arr(P.certifications);
    EDUCATION  = arr(P.education);
    CUSTOM     = arr(P.sections);
    computeTotals();

    const cfgMode = (P.theme && P.theme.mode) === "light" ? "light" : "dark";
    themeMode = cfgMode;
    applyCurrentTheme();

    const pdfCfg = P.pdf && typeof P.pdf === "object" ? P.pdf : {};
    pdfChoice = {
      template: has(pdfCfg.template) ? pdfCfg.template : "compact",
      paper: pdfCfg.paper === "letter" ? "letter" : "a4"
    };

    if (revealObserver) revealObserver.disconnect();
    if (sectionObserver) sectionObserver.disconnect();

    clear(main); clear(navList); clear(mobileList); clear(footer);
    footer.hidden = true;

    clear(brand);
    const first = String(profile.shortName || profile.name || "").trim().split(/\s+/)[0] || "portfolio";
    append(brand, [first.toLowerCase(), el("span", { class: "dot", text: "." }), "dev"]);
    brand.setAttribute("aria-label", (profile.name || "Home") + " — back to top");

    renderHead();
    main.appendChild(renderHero());

    const active = buildSectionList();
    active.forEach(function (s) {
      if (s.footer) renderContact(footer);
      else main.appendChild(s.render());
    });

    [navList, mobileList].forEach(function (list) {
      active.forEach(function (s) {
        list.appendChild(el("li", null, el("a", { href: "#" + s.id, text: s.label })));
      });
    });

    // The print document is built on demand, not now: keeping a second
    // copy of the content (with its own <h1>) in the DOM at all times
    // would give the page two h1s and duplicate text for crawlers.
    clear(printRoot);

    main.setAttribute("aria-busy", "false");
    loadStatus.textContent = "Portfolio loaded.";

    drawIcons();
    setupReveal();
    setupActiveNav(active);
  }

  function showError(err) {
    clear(main);
    main.setAttribute("aria-busy", "false");
    loadStatus.textContent = "The portfolio content failed to load.";

    const isFile = window.location.protocol === "file:";
    main.appendChild(el("section", { class: "hero", "aria-labelledby": "err-title" },
      el("div", { class: "container" },
        el("div", { class: "error-panel", role: "alert" },
          el("p", { class: "eyebrow", text: "Content unavailable" }),
          el("h2", { id: "err-title", text: "Couldn't load data.json" }),
          el("p", { text: "The page loaded, but the content file behind it didn't. Everything below is generated from that file." }),
          el("p", { class: "error-detail", text: String((err && err.message) || err) }),
          isFile
            ? el("p", null, "You opened this file directly from disk, and browsers block ",
                el("code", { text: "fetch()" }), " on ", el("code", { text: "file://" }),
                " URLs. Serve the folder over HTTP instead — for example ",
                el("code", { text: "python3 -m http.server" }), " — or view it on GitHub Pages.")
            : el("p", null, "Check that ", el("code", { text: "data.json" }),
                " sits next to this page and contains valid JSON."),
          el("div", { class: "hero-cta", style: "margin-top:1.5rem" },
            el("button", { class: "btn btn-primary", type: "button", onclick: load }, icon("refresh-cw"), "Try again"),
            el("a", { class: "btn btn-ghost", href: "mailto:lakshmichaitanyareddyi@gmail.com" }, icon("mail"), "Email instead"))
        )
      )
    ));
    drawIcons();
  }

  /* ====================================================================
     11. LOAD + PREVIEW BRIDGE
     ==================================================================== */
  function load() {
    loadStatus.textContent = "Loading portfolio…";
    main.setAttribute("aria-busy", "true");
    fetch(DATA_URL, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status + " " + (res.statusText || "") + " while fetching " + DATA_URL);
        return res.text();
      })
      .then(function (body) {
        let data;
        try { data = JSON.parse(body); }
        catch (e) { throw new Error("data.json is not valid JSON — " + e.message); }
        render(data);
      })
      .catch(showError);
  }

  function setPrintPreview(on, template, paper) {
    document.body.classList.toggle("print-preview", !!on);
    document.body.classList.toggle("paper-letter", !!on && paper === "letter");
    if (on) buildPrintDoc(template || pdfChoice.template, paper || pdfChoice.paper);
  }

  function onPreviewMessage(event) {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.type !== "portfolio:data") return;
    try {
      render(msg.data);
      if (msg.mode === "light" || msg.mode === "dark") setMode(msg.mode);
      setPrintPreview(msg.view === "print", msg.pdfTemplate, msg.paper);
    } catch (e) { showError(e); }
  }

  /* ====================================================================
     12. CHROME
     ==================================================================== */
  function drawIcons() { if (window.lucide && window.lucide.createIcons) window.lucide.createIcons(); }
  document.addEventListener("DOMContentLoaded", drawIcons);
  window.addEventListener("load", drawIcons);

  function setupReveal() {
    const nodes = document.querySelectorAll(".reveal:not(.is-visible)");
    if (!("IntersectionObserver" in window)) {
      nodes.forEach((n) => n.classList.add("is-visible"));
      return;
    }
    revealObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add("is-visible");
        revealObserver.unobserve(entry.target);
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
    nodes.forEach((n) => revealObserver.observe(n));
  }

  function setupActiveNav(active) {
    const anchors = Array.prototype.slice.call(document.querySelectorAll("#nav-links a, #mobile-links a"));
    const targets = active.map((s) => document.getElementById(s.id)).filter(Boolean);
    if (!("IntersectionObserver" in window) || !targets.length) return;

    const ratios = {};
    sectionObserver = new IntersectionObserver(function (entries) {
      entries.forEach((e) => { ratios[e.target.id] = e.isIntersecting ? e.intersectionRatio : 0; });
      let best = null, bestRatio = 0;
      Object.keys(ratios).forEach((id) => { if (ratios[id] > bestRatio) { bestRatio = ratios[id]; best = id; } });
      anchors.forEach((a) => a.classList.toggle("is-active", !!best && a.getAttribute("href") === "#" + best));
    }, { rootMargin: "-45% 0px -45% 0px", threshold: [0, 0.25, 0.5, 1] });
    targets.forEach((t) => sectionObserver.observe(t));
  }

  // Theme toggle: in-memory only, nothing persisted
  document.getElementById("theme-toggle").addEventListener("click", function () {
    setMode(themeMode === "dark" ? "light" : "dark");
  });

  // Mobile menu
  const menuBtn = document.getElementById("menu-toggle");
  const mobileMenu = document.getElementById("mobile-menu");
  function closeMenu() {
    mobileMenu.classList.remove("is-open");
    menuBtn.setAttribute("aria-expanded", "false");
    menuBtn.setAttribute("aria-label", "Open navigation menu");
  }
  menuBtn.addEventListener("click", function () {
    const open = mobileMenu.classList.toggle("is-open");
    menuBtn.setAttribute("aria-expanded", String(open));
    menuBtn.setAttribute("aria-label", open ? "Close navigation menu" : "Open navigation menu");
  });
  mobileMenu.addEventListener("click", function (e) { if (e.target.closest("a")) closeMenu(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && mobileMenu.classList.contains("is-open")) { closeMenu(); menuBtn.focus(); }
  });

  // Header border once scrolled
  const header = document.getElementById("site-header");
  function onScroll() { header.classList.toggle("is-stuck", window.scrollY > 8); }
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  // Ctrl+P / ⌘P bypasses the dialog, so make sure there's something to print.
  window.addEventListener("beforeprint", function () {
    if (!printRoot.firstChild) buildPrintDoc(pdfChoice.template, pdfChoice.paper);
  });

  /* ====================================================================
     13. GO
     ==================================================================== */
  applyCurrentTheme();          // default theme paints the skeleton correctly

  if (PREVIEW) {
    window.addEventListener("message", onPreviewMessage);
    window.parent.postMessage({ type: "portfolio:preview-ready" }, "*");
    loadStatus.textContent = "Waiting for preview data…";
  } else {
    load();
  }
})();
</script>
</body>
</html>
